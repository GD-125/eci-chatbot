# Google Cloud Build configuration for Cloud Run deployment
# Project: election-ai-bot-2609
# Service: agentic-ai-chatbot
# Image: gcr.io/election-ai-bot-2609/agentic-ai-chatbot:latest

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/agentic-ai-chatbot:latest'
      - '.'
    id: 'build-image'

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/agentic-ai-chatbot:latest'
    id: 'push-image'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'agentic-ai-chatbot'
      - '--image=gcr.io/$PROJECT_ID/agentic-ai-chatbot:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=900'
      - '--port=8080'
      - '--max-instances=10'
      - '--set-env-vars=PYTHONUNBUFFERED=1'
    id: 'deploy'

images:
  - 'gcr.io/$PROJECT_ID/agentic-ai-chatbot:latest'

timeout: '1800s'
