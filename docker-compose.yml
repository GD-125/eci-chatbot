version: "3.9"

services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-ai-chatbot:latest
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - ./static:/app/static:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
